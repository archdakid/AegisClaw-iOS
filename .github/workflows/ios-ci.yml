name: AegisClaw iOS Build, xtool Package & Test CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  swift-package-xtool-and-ios-build:
    name: Swift 6 Tests, xtool Target Verification & Xcode iOS Build
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1 Toolchain & Verify iOS SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
          xcrun -sdk iphoneos -show-sdk-path

      - name: Validate xtool.yml & Config/XtoolInfo.plist Structure
        run: |
          test -f xtool.yml
          test -f Config/XtoolInfo.plist
          plutil -lint Config/XtoolInfo.plist
          plutil -lint Config/Info.plist
          plutil -lint Config/AegisClaw.entitlements

      - name: Build & Run Swift 6 Strict-Concurrency Package Tests (All 9 Tests)
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log || {
            ERR=$(tail -n 35 build.log | tr '\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=SwiftBuildError::$ERR"
            exit 1
          }
          swift test --parallel 2>&1 | tee test.log || {
            ERR=$(tail -n 35 test.log | tr '\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=SwiftTestError::$ERR"
            exit 1
          }

      - name: Generate Xcode Project via XcodeGen
        run: |
          set -o pipefail
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned iOS App for Physical Device (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AegisClaw.xcodeproj \
            -scheme AegisClaw \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcode_device.log || {
              ERR=$(tail -n 35 xcode_device.log | tr '\n' ' ' | sed 's/"/\\"/g')
              echo "::error title=XcodeDeviceBuildError::$ERR"
              exit 1
            }

      - name: Package Unsigned iOS IPA for Physical Device Sideloading
        run: |
          APP_PATH=$(find build_device/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate built .app bundle"
            find build_device -maxdepth 5
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"

          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/

          cd ipa_stage
          zip -qry ../AegisClaw-raw.ipa Payload
          cd ..

          python3 scripts/repack_clean.py AegisClaw-raw.ipa AegisClaw-unsigned.ipa
          rm -f AegisClaw-raw.ipa
          ls -lh AegisClaw-unsigned.ipa

      - name: Upload Unsigned IPA Artifact for xtool Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: AegisClaw-unsigned-ipa
          path: AegisClaw-unsigned.ipa
          retention-days: 14
